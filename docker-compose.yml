services:
  # --- SERVIZIO DATABASE ---
  db:
    image: mysql:8.0
    container_name: studenthub-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: studenthub_db
    ports:
      - "3308:3306"
    volumes:
      - ./backend/sql:/docker-entrypoint-initdb.d
      - db_data:/var/lib/mysql
    networks:
      - studenthub-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 20s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M

  # --- SERVIZIO BACKEND ---
  backend:
    build: ./backend
    container_name: studenthub-backend
    restart: always
    ports:
      - "3010:3000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=studenthub_db
      - DB_PORT=3306
      - PORT=3000
      - NODE_ENV=production
      - CORS_ORIGIN=${CORS_ORIGIN}
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
    networks:
      - studenthub-net
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:3000/health",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M

  # --- SERVIZIO FRONTEND ---
  frontend:
    build: ./frontend
    container_name: studenthub-frontend
    restart: always
    ports:
      - "80:80" # nginx (produzione) — era 5173:5173 (Vite dev)
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - studenthub-net
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
        reservations:
          cpus: "0.10"
          memory: 64M

volumes:
  db_data:

networks:
  studenthub-net:
    driver: bridge
