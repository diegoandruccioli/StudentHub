server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Gestione SPA: tutte le route non-file vengono reindirizzate a index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache aggressiva per asset statici con hash nel nome (Vite aggiunge hash automaticamente)
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Disabilita la versione di nginx negli header (sicurezza)
    server_tokens off;

    # Gzip per ridurre il peso del bundle
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;
}
